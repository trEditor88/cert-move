<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공동인증서 옮기기</title>
<meta name="description" content="한국 PC의 공동인증서를 미국 가족 PC로 옮기는 단계별 안내">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230066CC'/%3E%3Cpath d='M20 30v-6a12 12 0 0 1 24 0v6' fill='none' stroke='white' stroke-width='5'/%3E%3Crect x='15' y='29' width='34' height='22' rx='4' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --canvas:#FFFFFF; --parchment:#F5F5F7; --pearl:#FAFAFC;
  --ink:#1D1D1F; --muted:#5E5E63; --border:#D9D9DE; --hairline:rgba(0,0,0,0.10);
  --blue:#0066CC; --blue-focus:#0071E3; --blue-soft:#E8F1FB;
  --green:#15803D; --green-soft:#EAF6EE; --warn:#8A5A00; --warn-soft:#FFF6E0;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-pill:9999px;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#111113; --parchment:#1C1C1F; --pearl:#232327;
    --ink:#F2F2F4; --muted:#B0B0B6; --border:#3A3A40; --hairline:rgba(255,255,255,0.12);
    --blue:#4BA3FF; --blue-focus:#6CB4FF; --blue-soft:#14273D;
    --green:#5CCB84; --green-soft:#132A1C; --warn:#F2C064; --warn-soft:#2E2412;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#111113; --parchment:#1C1C1F; --pearl:#232327;
  --ink:#F2F2F4; --muted:#B0B0B6; --border:#3A3A40; --hairline:rgba(255,255,255,0.12);
  --blue:#4BA3FF; --blue-focus:#6CB4FF; --blue-soft:#14273D;
  --green:#5CCB84; --green-soft:#132A1C; --warn:#F2C064; --warn-soft:#2E2412;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-size:1.1875rem;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-focus);outline-offset:3px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--canvas);border-bottom:1px solid var(--hairline)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{font-weight:700;font-size:1.05rem;flex:1;min-width:0}
.home-btn{white-space:nowrap}
.home-btn{border:1px solid var(--border);background:var(--pearl);border-radius:var(--r-pill);padding:6px 14px;font-size:0.95rem;cursor:pointer;min-height:40px}
.home-btn[hidden]{display:none}
main{padding:28px 0 140px}
h1{font-size:clamp(1.75rem,5vw,2.4rem);line-height:1.3;margin:0 0 12px;font-weight:700;letter-spacing:-0.01em}
h2{font-size:clamp(1.5rem,4.4vw,2rem);line-height:1.35;margin:4px 0 16px;font-weight:700;letter-spacing:-0.01em}
h2:focus{outline:none}
h3{font-size:1.2rem;margin:28px 0 8px}
p{margin:0 0 14px}
.lead{font-size:1.25rem;color:var(--muted)}
.muted{color:var(--muted)}
b,strong{font-weight:700}
code.k{font-family:Consolas,'D2Coding',monospace;background:var(--parchment);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:0.95em}

/* 첫 화면 */
.choices{display:grid;gap:16px;margin:28px 0}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--border);background:var(--parchment);border-radius:var(--r-lg);padding:24px 22px;cursor:pointer;transition:border-color .15s}
.choice:hover{border-color:var(--blue)}
.choice .t{display:block;font-size:1.5rem;font-weight:700;color:var(--blue);line-height:1.35}
.choice .d{display:block;margin-top:6px;color:var(--muted);font-size:1.05rem}
.choice .resume{display:block;margin-top:10px;font-size:1rem;color:var(--green);font-weight:600}
@media (min-width:640px){.choices{grid-template-columns:1fr 1fr}}

/* 진행 */
.prog{margin:0 0 22px}
.prog .lbl{display:flex;justify-content:space-between;font-size:1rem;color:var(--muted);margin-bottom:8px}
.bar{height:10px;background:var(--parchment);border:1px solid var(--border);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:var(--r-pill);transition:width .25s}

ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:8px 0 18px}
ol.steps>li{counter-increment:s;position:relative;padding:4px 0 14px 52px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:2px;width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1.05rem}
ol.steps ul{margin:6px 0 0;padding-left:22px}
ul.plain{margin:6px 0 16px;padding-left:24px}
ul.plain li{margin-bottom:6px}

.box{border-radius:var(--r-md);padding:16px 18px;margin:18px 0;border:1px solid var(--border);background:var(--parchment)}
.box.key{background:var(--blue-soft);border-color:transparent}
.box.warn{background:var(--warn-soft);border-color:transparent}
.box.ok{background:var(--green-soft);border-color:transparent}
.box .h{display:block;font-weight:700;margin-bottom:4px}
.tag{display:inline-block;background:var(--blue);color:var(--canvas);border-radius:var(--r-pill);padding:0 10px;font-size:0.85rem;margin-right:6px;vertical-align:2px}
.box p:last-child,.box ul:last-child{margin-bottom:0}

.path{margin:10px 0 18px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--pearl);padding:12px}
.path pre{margin:0 0 10px;font-family:Consolas,'D2Coding',monospace;font-size:1.05rem;white-space:pre-wrap;word-break:break-all;user-select:all;-webkit-user-select:all;cursor:text;padding:6px 4px}
.copy{border:0;background:var(--blue);color:#fff;border-radius:var(--r-pill);padding:10px 22px;font-weight:600;cursor:pointer;min-height:48px;font-size:1.05rem}
:root[data-theme="dark"] .copy{color:#0B1A2B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .copy{color:#0B1A2B}}
.copy-msg{display:inline-block;margin-left:10px;font-size:1rem;color:var(--green);font-weight:600}
.copy-msg.fail{color:var(--warn)}

.tree{font-family:Consolas,'D2Coding',monospace;background:var(--pearl);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;white-space:pre;overflow-x:auto;font-size:1rem;line-height:1.7;margin:10px 0 18px}

.checks{list-style:none;padding:0;margin:10px 0 18px}
.checks li{margin-bottom:10px}
.checks label{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);cursor:pointer;background:var(--canvas)}
.checks input{width:26px;height:26px;flex:0 0 26px;margin-top:3px;accent-color:var(--blue)}
.checks input:checked+span{color:var(--muted)}

details{border:1px solid var(--border);border-radius:var(--r-md);margin:16px 0;background:var(--canvas)}
details summary{cursor:pointer;padding:14px 16px;font-weight:700;color:var(--blue);min-height:48px}
details>div{padding:0 16px 8px}

.faq{margin:10px 0 18px;border-top:1px solid var(--border)}
.faq .q{font-weight:700;margin:16px 0 4px}
.faq .a{margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid var(--border)}

/* 아래 고정 버튼 */
nav.pager{position:fixed;left:0;right:0;bottom:0;background:var(--canvas);border-top:1px solid var(--hairline);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
nav.pager .wrap{display:flex;gap:12px}
nav.pager button{flex:1;min-height:58px;border-radius:var(--r-md);font-size:1.15rem;font-weight:700;cursor:pointer}
.prev{background:var(--pearl);border:1px solid var(--border)}
.next{background:var(--blue);border:1px solid var(--blue);color:#fff}
:root[data-theme="dark"] .next{color:#0B1A2B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .next{color:#0B1A2B}}
.prev[disabled]{opacity:.4;cursor:default}
nav.pager[hidden]{display:none}
footer{color:var(--muted);font-size:0.95rem;margin-top:36px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header.top,nav.pager{display:none}main{padding:0}}
</style>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('cert-move:theme')==='dark'?'dark':'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="brand">공동인증서 옮기기</span>
  <button class="home-btn" id="themeBtn" type="button" aria-pressed="false">어두운 화면</button>
  <button class="home-btn" id="homeBtn" type="button" hidden>처음 화면</button>
</div></header>

<main><div class="wrap" id="view" aria-live="polite"></div></main>

<nav class="pager" id="pager" hidden><div class="wrap">
  <button class="prev" id="prevBtn" type="button">← 이전</button>
  <button class="next" id="nextBtn" type="button">다음 →</button>
</div></nav>

<noscript><div class="wrap"><p>이 안내는 자바스크립트가 켜져 있어야 보입니다. 다른 인터넷 창(크롬, 엣지)으로 열어 주세요.</p></div></noscript>

<script>
(function(){
'use strict';
var KEY = 'cert-move:v1';

/* ---- 화면 조각 ---- */
function path(text){
  return '<div class="path"><pre>' + text + '</pre>' +
    '<button class="copy" type="button" data-copy="' + text + '">복사</button>' +
    '<span class="copy-msg" role="status"></span></div>';
}
var PHONE_RULE = '<div class="box key"><span class="h"><span class="tag">추천</span> 비밀번호는 전화로 알려 주세요</span>' +
  '<p>압축파일은 카카오톡이나 이메일로, 비밀번호는 <b>전화 통화로</b> 따로 전하시는 것을 추천합니다. 파일과 비밀번호가 한 메시지 창에 같이 있으면, 그 메시지가 다른 사람 손에 들어갔을 때 인증서를 바로 쓸 수 있게 되기 때문입니다.</p></div>';
var OWNER_NOTE = ' 인증서 주인(명의자) 본인이 직접 쓰시기 위해 옮기는 방법입니다.';
var MENU_NOTE = '<div class="box"><span class="h">화면 글자가 조금 달라도 괜찮습니다</span>' +
  '<p>반디집은 버전마다 메뉴 이름이 조금씩 다릅니다. 이 안내와 글자가 똑같지 않으면, <b>뜻이 같은 메뉴</b>를 골라 주세요. 아래에 자주 보이는 다른 이름도 함께 적어 두었습니다.</p></div>';
var BANDI_INSTALL =
  '<ol class="steps">' +
  '<li>인터넷 창(크롬이나 엣지)을 여시고, 맨 위 주소창에 아래 주소를 입력한 뒤 엔터를 누르세요.' + path('bandisoft.com') + '</li>' +
  '<li>화면에 보이는 <b>반디집 다운로드</b> 버튼을 누르세요. 화면이 영어로 나오면 <b>Download</b> 버튼입니다.</li>' +
  '<li>화면 아래쪽이나 오른쪽 위에 내려받은 파일 이름이 보이면 그것을 눌러 실행하세요.</li>' +
  '<li>"이 앱이 디바이스를 변경하도록 허용하시겠어요?"라는 창이 뜨면 <b>예</b>를 누르세요.</li>' +
  '<li><b>동의 및 설치</b>(영어로는 <b>Agree &amp; Install</b>) 버튼을 누르고, 설치가 끝나면 <b>닫기</b>를 누르세요.</li>' +
  '</ol>' +
  '<p class="muted">반디집은 무료입니다. 설치 중에 다른 프로그램을 함께 설치하겠느냐고 물으면, 표시를 끄고 넘어가셔도 됩니다.</p>';
var FIX_TABLE =
  '<div class="faq">' +
  '<p class="q">인증서 목록에 이름이 안 보여요</p><p class="a">"압축 풀기" 단계의 폴더 모양과 똑같은지 확인해 주세요. <code class="k">NPKI</code> 폴더를 열었을 때 <b>바로 안에</b> 회사 이름 폴더(예: <code class="k">yessign</code>)가 있어야 합니다. <code class="k">NPKI</code> 안에 <code class="k">NPKI</code>가 또 있거나, 회사 이름 폴더 안에 같은 이름 폴더가 한 번 더 있으면 안쪽 것을 꺼내 한 칸 위로 옮겨 주세요.</p>' +
  '<p class="q">보안 프로그램을 설치하라고 나와요</p><p class="a">처음 쓰는 컴퓨터라서 그렇습니다. 화면 안내대로 설치하신 뒤 인터넷 창을 모두 닫았다가 다시 열어 주세요.</p>' +
  '<p class="q">로그인할 때 휴대폰 문자 인증을 해 달래요</p><p class="a">인증번호는 한국 휴대폰으로 갑니다. 한국에서 문자를 받으신 분이 <b>전화로</b> 불러 주시면 됩니다.</p>' +
  '<p class="q">사이트에 아예 들어가지지 않아요</p><p class="a">해외에서 들어오는 접속을 막아 둔 사이트일 수 있습니다. 해당 은행 앱이나 고객센터에 <b>해외 접속 허용</b>이 되는지 문의해 주세요.</p>' +
  '<p class="q">압축 풀 때 비밀번호가 틀렸다고 나와요</p><p class="a">압축 비밀번호는 인증서 비밀번호와 <b>다른 것</b>입니다. 전화로 한 글자씩 다시 확인해 주세요.</p>' +
  '<p class="q">로그인할 때 인증서 비밀번호가 틀렸다고 나와요</p><p class="a">대문자·소문자와 특수문자를 천천히 확인해 주세요. 보통 <b>5번</b> 틀리면 잠기니, 3번째쯤에서 멈추고 전화로 다시 확인하시는 것이 안전합니다.</p>' +
  '<p class="q">"찾을 수 없습니다"라는 창이 떠요</p><p class="a">주소를 한 글자라도 다르게 입력하면 이 창이 뜹니다. 안내 화면의 <b>복사</b> 버튼으로 복사해서 붙여 넣어 주세요. 그래도 같으면 <code class="k">NPKI</code> 폴더가 아직 없는 경우이니 "인증서 넣을 곳 열기" 단계의 "없으시면" 순서를 따라 주세요.</p>' +
  '</div>' +
  '<div class="box"><p>그래도 안 되시면 지금 보이는 컴퓨터 화면을 휴대폰으로 찍어서, 도와주시는 분께 보내 주세요.</p></div>';

/* ---- 단계 ---- */
var FLOWS = {
send: {
  name:'한국에서 보내시는 분',
  steps:[
  {t:'준비 확인', h:function(){return '' +
    '<p class="lead">한국 컴퓨터에 있는 공동인증서를 미국 가족 컴퓨터로 옮기는 안내입니다. 처음 하셔도 <b>20분 정도</b>면 충분합니다.' + OWNER_NOTE + '</p>' +
    '<p>시작하시기 전에 아래 다섯 가지를 확인해 주세요. 눌러서 표시하실 수 있습니다.</p>' +
    checks('send', [
      '<b>인증서 비밀번호</b>를 알고 있습니다. (은행 사이트에 로그인할 때 쓰시는 그 비밀번호입니다)',
      '이 컴퓨터가 <b>윈도우 컴퓨터</b>입니다. (애플 맥 컴퓨터라면 순서가 다르니, 도와주시는 분께 먼저 말씀해 주세요)',
      '미국 가족과 <b>전화 통화</b>를 할 수 있습니다.',
      '양쪽이 동시에 컴퓨터 앞에 있을 <b>시간을 약속</b>했습니다. (한국과 미국은 시차가 있습니다)',
      '<b>20분 정도</b> 여유가 있습니다.'
    ]) +
    '<p class="muted">창을 닫았다가 다시 여셔도 보시던 단계부터 이어집니다.</p>';}},
  {t:'반디집 설치', h:function(){return '' +
    '<p class="lead">비밀번호를 걸어 압축하려면 <b>반디집</b>이라는 무료 압축 프로그램이 필요합니다. 윈도우에 원래 있는 압축 기능으로는 비밀번호를 걸 수 없습니다.</p>' +
    '<div class="box ok"><p>이미 반디집이 깔려 있으시면 이 단계는 건너뛰고 <b>다음</b>을 누르세요. 바탕화면이나 시작 메뉴에 반디집 아이콘이 있으면 깔려 있는 것입니다.</p></div>' +
    BANDI_INSTALL + MENU_NOTE;}},
  {t:'NPKI 폴더 열기', h:function(){return '' +
    '<p class="lead">공동인증서는 컴퓨터 안의 <code class="k">NPKI</code>라는 폴더에 들어 있습니다. 이 폴더를 열어 보겠습니다.</p>' +
    '<ol class="steps">' +
    '<li>키보드 맨 아랫줄 왼쪽에 있는 <b>윈도우 키</b>(창문 모양 그림이 있는 키)를 누른 채로, <b>R</b> 키를 한 번 누르세요.</li>' +

    '<p>잘 안 되시면 <b>다음</b>을 눌러 문제 해결표를 봐 주세요.</p>';}},
  {t:'문제 해결', h:function(){return '' +
    '<p class="lead">대부분은 아래에서 해결됩니다. 로그인까지 잘 되셨다면 <b>다음</b>을 눌러 마무리로 가세요.</p>' + FIX_TABLE;}},
  {t:'마무리', h:function(){return '' +
    '<p class="lead">로그인까지 확인되셨다면, 마지막으로 아래 정리만 해 주세요. 인증서를 안전하게 지키는 단계입니다.</p>' +
    checks('recvEnd', [
      '바탕화면과 다운로드 폴더의 <b>받은 압축파일</b> 지우기 (<code class="k">NPKI</code> 안에 풀린 폴더는 그대로 두세요)',
      '카카오톡 대화방이나 이메일의 <b>받은 압축파일</b> 지우기',
      '비밀번호를 적어 둔 <b>종이나 메모</b> 버리기'
    ]) +
    '<div class="box"><span class="h">나중에 이 컴퓨터에서 더 쓰지 않게 되면</span><p><code class="k">NPKI</code> 안의 해당 인증서 폴더를 지워 주세요. 앞 단계의 주소로 <code class="k">NPKI</code> 폴더를 열 수 있습니다.</p></div>' +
    '<div class="box"><span class="h">1년마다 갱신</span><p>인증서는 1년마다 갱신해야 합니다. 만료일이 다가오면 한국에서 갱신한 뒤 이 안내대로 다시 보내 주시면, 같은 순서로 다시 넣으시면 됩니다.</p></div>' +
    '<div class="box key"><span class="h">기억해 주세요</span><p>비밀번호는 언제나 전화로만 주고받습니다. 메시지로 비밀번호를 받으셨다면 그 메시지는 지워 주세요.</p></div>' +
    '<p>수고 많으셨습니다. 모두 끝났습니다.</p>';}}
  ]
}
};

/* ---- 저장 ---- */
var st = {flow:null, step:{send:0, recv:0}, chk:{}};
try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && typeof s === 'object') {
  if (s.flow === 'send' || s.flow === 'recv') st.flow = s.flow;
  if (s.step) ['send','recv'].forEach(function(f){ var n = +s.step[f]; if (n >= 0 && n < FLOWS[f].steps.length) st.step[f] = n|0; });
  if (s.chk && typeof s.chk === 'object') st.chk = s.chk;
}} catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} }

function checks(id, items){
  var on = st.chk[id] || [];
  return '<ul class="checks">' + items.map(function(t, i){
    return '<li><label><input type="checkbox" data-chk="' + id + '" data-i="' + i + '"' + (on[i] ? ' checked' : '') + '><span>' + t + '</span></label></li>';
  }).join('') + '</ul>';
}

/* ---- 그리기 ---- */
var view = document.getElementById('view'), pager = document.getElementById('pager');
var homeBtn = document.getElementById('homeBtn'), prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');

function resumeText(f){ var n = st.step[f]; return n > 0 ? '<span class="resume">이어서 보기: ' + (n+1) + '단계 「' + FLOWS[f].steps[n].t + '」</span>' : ''; }

function render(focus){
  if (!st.flow) {
    homeBtn.hidden = true; pager.hidden = true;
    document.title = '공동인증서 옮기기';
    view.innerHTML =
      '<h1>공동인증서 옮기기 안내</h1>' +
      '<p class="lead">한국 컴퓨터의 공동인증서를 미국 가족 컴퓨터로 옮기는 방법을 한 단계씩 안내해 드립니다. 아래에서 지금 계신 쪽을 눌러 주세요.</p>' +
      '<div class="choices">' +
      '<button class="choice" type="button" data-go="send"><span class="t">한국에서 보내시는 분</span><span class="d">인증서를 비밀번호 걸어 압축하고, 가족에게 보내는 순서입니다. (7단계)</span>' + resumeText('send') + '</button>' +
      '<button class="choice" type="button" data-go="recv"><span class="t">미국에서 받으시는 가족</span><span class="d">받은 파일을 풀어 넣고, 로그인까지 확인하는 순서입니다. (6단계)</span>' + resumeText('recv') + '</button>' +
      '</div>' +
      '<footer>이 페이지는 아무것도 서버에 저장하지 않습니다. 보시던 단계만 이 기기에 기억합니다.</footer>';
    if (focus) view.querySelector('h1').setAttribute('tabindex','-1'), view.querySelector('h1').focus();
    return;
  }
  var F = FLOWS[st.flow], n = st.step[st.flow], S = F.steps[n], total = F.steps.length;
  homeBtn.hidden = false; pager.hidden = false;
  document.title = S.t + ' · 공동인증서 옮기기';
  view.innerHTML =
    '<div class="prog"><div class="lbl"><span>' + F.name + '</span><span>' + (n+1) + ' / ' + total + ' 단계</span></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="' + total + '" aria-valuenow="' + (n+1) + '" aria-label="진행"><i style="width:' + ((n+1)/total*100) + '%"></i></div></div>' +
    '<h2 tabindex="-1">' + (n+1) + '. ' + S.t + '</h2>' + S.h();
  prevBtn.disabled = n === 0;
  nextBtn.textContent = n === total - 1 ? '처음 화면으로' : '다음 →';
  if (focus) { window.scrollTo(0, 0); view.querySelector('h2').focus({preventScroll:true}); }
}

/* ---- 복사 ---- */
function copyText(btn){
  var text = btn.getAttribute('data-copy'), msg = btn.nextElementSibling, pre = btn.previousElementSibling;
  function ok(){ msg.className = 'copy-msg'; msg.textContent = '복사했습니다. 붙여 넣으시면 됩니다.'; }
  function fail(){
    try { var r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch(e) {}
    msg.className = 'copy-msg fail'; msg.textContent = '글자를 선택해 두었습니다. Ctrl 키를 누른 채 C 를 눌러 복사해 주세요.';
  }
  function legacy(){
    try {
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly','');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; document.body.appendChild(ta); ta.select();
      var done = document.execCommand('copy'); document.body.removeChild(ta); done ? ok() : fail();
    } catch(e) { fail(); }
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, legacy);
  else legacy();
}

/* ---- 이벤트 ---- */
document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-go')) { st.flow = t.getAttribute('data-go'); save(); render(true); }
  else if (t.hasAttribute('data-copy')) copyText(t);
});
document.addEventListener('change', function(e){
  var t = e.target; if (!t.hasAttribute('data-chk')) return;
  var id = t.getAttribute('data-chk'), i = +t.getAttribute('data-i');
  (st.chk[id] = st.chk[id] || [])[i] = t.checked; save();
});
homeBtn.addEventListener('click', function(){ st.flow = null; save(); render(true); });
prevBtn.addEventListener('click', function(){ if (st.step[st.flow] > 0) { st.step[st.flow]--; save(); render(true); } });
nextBtn.addEventListener('click', function(){
  var total = FLOWS[st.flow].steps.length;
  if (st.step[st.flow] < total - 1) st.step[st.flow]++; else st.flow = null;
  save(); render(true);
});
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '밝은 화면' : '어두운 화면';
  themeBtn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  try { localStorage.setItem('cert-move:theme', t); } catch(e) {}
}
var themeBtn = document.getElementById('themeBtn');
setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
themeBtn.addEventListener('click', function(){ setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
render(false);
})();
</script>
</body>
</html>
